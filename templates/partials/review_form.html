{% if error %}<div class="error">{{error}}</div>{% endif %}<form hx-post="{% url 'add_review' movie.slug %}" hx-target="#review-list" hx-swap="outerHTML" @submit="if(!valid) $event.preventDefault()"><div class="form-row"><input name="author_name" placeholder="Your name" required><div x-data="starRating()" class="stars"><input type="hidden" name="rating" :value="rating"><template x-for="n in 10" :key="n"><button type="button" @mouseenter="hover=n" @mouseleave="hover=0" @click="rating=n" :class="{lit:n<=(hover||rating)}" :aria-label="n+' out of 10'">★</button></template><span x-text="(hover||rating)+'/10'"></span></div></div><textarea name="body" x-model="body" maxlength="500" placeholder="Share what you thought…"></textarea><div class="counter"><span x-text="body.length"></span>/500 <span x-show="body.length<10">• minimum 10 characters</span></div><label><input type="checkbox" name="has_spoilers"> Contains spoilers</label><button class="primary" :disabled="body.length<10 || rating<1">Post review</button></form>

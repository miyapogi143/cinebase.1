<div id="review-list">{% for r in movie.reviews.all %}<article class="review" x-data="{show:false}"><div class="review-meta"><strong>{{r.author_name}}</strong><span>★ {{r.rating}}/10</span><time>{{r.date_created|date:'M d, Y'}}</time></div><div class="spoiler" :class="{'blurred':{{r.has_spoilers|yesno:'true,false'}} && !show}"><p>{{r.body}}</p></div>{% if r.has_spoilers %}<button class="link-btn" @click="show=!show" x-text="show?'Hide spoilers':'Show spoilers'"></button>{% endif %}</article>{% empty %}<p class="muted">No reviews yet. Be the first to rate this movie.</p>{% endfor %}</div>

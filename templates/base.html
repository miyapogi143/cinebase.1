{% load static %}<!doctype html><html lang="en" x-data="appShell()" :class="{dark:theme.dark}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CineBase{% endblock %}</title><meta name="description" content="CineBase interactive movie database"><script src="https://unpkg.com/htmx.org@2.0.4" defer></script><script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script><link rel="stylesheet" href="{% static 'css/app.css' %}"><script src="{% static 'js/alpine.js' %}" defer></script><style>[x-cloak]{display:none!important}</style></head><body hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}' @keydown.escape.window="closeOverlays()" @toast.window="toasts.add($event.detail)">
<header class="nav" x-data="mobileNav()"><div class="nav-inner"><a href="/" class="brand"><span class="brand-mark">C</span><span>Cine<span>Base</span></span></a><button class="icon-btn mobile-only" @click="open=!open" :aria-expanded="open" aria-label="Toggle menu">☰</button><nav class="nav-links" :class="{'is-open':open}" @click="open=false"><a href="/">Discover</a><a href="/watchlist/">Watchlist <span x-show="watchlist.count" x-text="watchlist.count" class="badge"></span></a><a href="/manage/movies/new/">Editor</a></nav><div class="nav-actions"><button class="icon-btn" @click="theme.toggle()" :aria-label="theme.dark?'Use light mode':'Use dark mode'"><span x-text="theme.dark?'☀':'☾'"></span></button></div></div></header>
<main>{% block content %}{% endblock %}</main>
<div class="toast-stack" x-data="toastStack()" x-cloak><template x-for="toast in toasts.items" :key="toast.id"><div class="toast" :class="toast.type" x-transition><span x-text="toast.message"></span><button @click="toasts.remove(toast.id)">×</button></div></template></div>
<footer><div><strong>CineBase</strong><span> A polished Alpine.js + Django + HTMX movie database.</span></div><span>Built for IT 424 • 2026</span></footer></body></html>
